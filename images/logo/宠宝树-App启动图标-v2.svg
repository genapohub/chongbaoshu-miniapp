<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E94560"/>
      <stop offset="100%" stop-color="#FD79A8"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E94560"/>
      <stop offset="100%" stop-color="#C73650"/>
    </linearGradient>
  </defs>
  
  <!-- 渐变背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- 树形 -->
  <g transform="translate(256, 280)">
    <!-- 树干 -->
    <rect x="-25" y="-40" width="50" height="80" rx="8" fill="white"/>
    
    <!-- 树冠 - 左 -->
    <ellipse cx="-60" cy="-80" rx="55" ry="50" fill="white" opacity="0.9"/>
    
    <!-- 树冠 - 右 -->
    <ellipse cx="60" cy="-80" rx="55" ry="50" fill="white" opacity="0.9"/>
    
    <!-- 树冠 - 上 -->
    <ellipse cx="0" cy="-130" rx="50" ry="45" fill="white" opacity="0.95"/>
    
    <!-- 爪印 - 左上 -->
    <g transform="translate(-60, -80)">
      <ellipse cx="0" cy="5" rx="18" ry="15" fill="url(#bgGradient)"/>
      <circle cx="-12" cy="-8" r="10" fill="url(#bgGradient)"/>
      <circle cx="12" cy="-8" r="10" fill="url(#bgGradient)"/>
    </g>
    
    <!-- 爪印 - 右上 -->
    <g transform="translate(60, -80)">
      <ellipse cx="0" cy="5" rx="18" ry="15" fill="url(#bgGradient)"/>
      <circle cx="-12" cy="-8" r="10" fill="url(#bgGradient)"/>
      <circle cx="12" cy="-8" r="10" fill="url(#bgGradient)"/>
    </g>
    
    <!-- 爪印 - 顶部 -->
    <g transform="translate(0, -130)">
      <ellipse cx="0" cy="5" rx="20" ry="17" fill="url(#bgGradient)"/>
      <circle cx="-14" cy="-10" r="11" fill="url(#bgGradient)"/>
      <circle cx="14" cy="-10" r="11" fill="url(#bgGradient)"/>
    </g>
  </g>
  
  <!-- 小装饰 -->
  <circle cx="420" cy="100" r="15" fill="white" opacity="0.3"/>
  <circle cx="450" cy="140" r="10" fill="white" opacity="0.2"/>
  <circle cx="80" cy="400" r="12" fill="white" opacity="0.2"/>
  <circle cx="60" cy="360" r="8" fill="white" opacity="0.3"/>
</svg>