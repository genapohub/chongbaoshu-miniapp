<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A8C5C"/>
      <stop offset="100%" stop-color="#3D6B4B"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4914A"/>
      <stop offset="100%" stop-color="#C07830"/>
    </linearGradient>
  </defs>
  
  <g transform="translate(256, 310)">
    <!-- 树干 - 更有机的曲线 -->
    <path d="M-26 -10 C-30 -40 -24 -70 -22 -85 C-20 -95 -10 -100 0 -102 C10 -100 20 -95 22 -85 C24 -70 30 -40 26 -10 C28 5 20 15 0 18 C-20 15 -28 5 -26 -10Z" fill="url(#treeGrad)"/>
    
    <!-- 树冠 左 -->
    <ellipse cx="-75" cy="-105" rx="62" ry="56" fill="url(#treeGrad)"/>
    <!-- 树冠 右 -->
    <ellipse cx="75" cy="-105" rx="62" ry="56" fill="url(#treeGrad)"/>
    <!-- 树冠 上 -->
    <ellipse cx="0" cy="-160" rx="58" ry="52" fill="url(#treeGrad)"/>
    
    <!-- 高光 -->
    <ellipse cx="-65" cy="-115" rx="25" ry="18" fill="white" opacity="0.1"/>
    <ellipse cx="65" cy="-115" rx="25" ry="18" fill="white" opacity="0.1"/>
    <ellipse cx="0" cy="-170" rx="22" ry="16" fill="white" opacity="0.1"/>
    
    <!-- 爪印 左上 -->
    <g transform="translate(-75,-105)">
      <ellipse cx="0" cy="4" rx="16" ry="13" fill="url(#pawGrad)"/>
      <circle cx="-10" cy="-7" r="8" fill="url(#pawGrad)"/>
      <circle cx="10" cy="-7" r="8" fill="url(#pawGrad)"/>
    </g>
    <!-- 爪印 右上 -->
    <g transform="translate(75,-105)">
      <ellipse cx="0" cy="4" rx="16" ry="13" fill="url(#pawGrad)"/>
      <circle cx="-10" cy="-7" r="8" fill="url(#pawGrad)"/>
      <circle cx="10" cy="-7" r="8" fill="url(#pawGrad)"/>
    </g>
    <!-- 爪印 顶部 -->
    <g transform="translate(0,-160)">
      <ellipse cx="0" cy="3" rx="18" ry="14" fill="url(#pawGrad)"/>
      <circle cx="-12" cy="-8" r="9" fill="url(#pawGrad)"/>
      <circle cx="12" cy="-8" r="9" fill="url(#pawGrad)"/>
    </g>
    
    <!-- 小新芽 -->
    <path d="M90 -140 C95 -155 100 -160 105 -155" stroke="#4A8C5C" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M95 -145 C92 -150 90 -155 92 -158" stroke="#4A8C5C" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
