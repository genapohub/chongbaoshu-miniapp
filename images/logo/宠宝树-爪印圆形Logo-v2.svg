<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E94560"/>
      <stop offset="100%" stop-color="#FD79A8"/>
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="256" cy="256" r="240" fill="url(#circleGradient)"/>
  
  <!-- 内圈装饰 -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#brandGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- 宠物爪印大 -->
  <!-- 主肉垫 -->
  <ellipse cx="256" cy="290" rx="65" ry="55" fill="url(#brandGradient)"/>
  
  <!-- 上排肉垫 - 左 -->
  <ellipse cx="196" cy="220" rx="30" ry="35" fill="url(#brandGradient)"/>
  
  <!-- 上排肉垫 - 中左 -->
  <ellipse cx="246" cy="195" rx="28" ry="32" fill="url(#brandGradient)"/>
  
  <!-- 上排肉垫 - 中右 -->
  <ellipse cx="296" cy="195" rx="28" ry="32" fill="url(#brandGradient)"/>
  
  <!-- 上排肉垫 - 右 -->
  <ellipse cx="346" cy="220" rx="30" ry="35" fill="url(#brandGradient)"/>
  
  <!-- 小装饰点 -->
  <circle cx="180" cy="320" r="8" fill="url(#brandGradient)" opacity="0.5"/>
  <circle cx="332" cy="320" r="8" fill="url(#brandGradient)" opacity="0.5"/>
  <circle cx="256" cy="380" r="6" fill="url(#brandGradient)" opacity="0.5"/>
</svg>