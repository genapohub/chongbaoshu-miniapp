<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E94560"/>
      <stop offset="100%" stop-color="#FD79A8"/>
    </linearGradient>
  </defs>
  
  <!-- Logo图标区域 -->
  <g transform="translate(50, 25)">
    <!-- 树形轮廓 -->
    <path d="M100 200 L100 120 Q100 80 130 80 Q160 80 160 120 L160 140 
             Q160 110 190 110 Q220 110 220 140 L220 120 
             Q220 80 250 80 Q280 80 280 120 L280 200 Z" 
          fill="url(#brandGradient)" opacity="0.2"/>
    
    <!-- 树干 -->
    <rect x="115" y="150" width="50" height="60" rx="5" fill="url(#brandGradient)"/>
    
    <!-- 树冠左 -->
    <ellipse cx="95" cy="110" rx="45" ry="40" fill="url(#brandGradient)"/>
    
    <!-- 树冠右 -->
    <ellipse cx="185" cy="110" rx="45" ry="40" fill="url(#brandGradient)"/>
    
    <!-- 树冠顶 -->
    <ellipse cx="140" cy="70" rx="40" ry="35" fill="url(#brandGradient)"/>
    
    <!-- 爪印装饰 -->
    <circle cx="140" cy="50" r="12" fill="white"/>
    <circle cx="120" cy="35" r="8" fill="white"/>
    <circle cx="160" cy="35" r="8" fill="white"/>
  </g>
  
  <!-- 品牌文字 -->
  <text x="320" y="140" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" 
        font-size="72" font-weight="800" fill="url(#brandGradient)">宠宝树</text>
  
  <!-- 英文副标题 -->
  <text x="320" y="180" font-family="'Arial', sans-serif" 
        font-size="18" font-weight="600" fill="#6B7280" letter-spacing="8">PET FAMILY TREE</text>
  
  <!-- 装饰线 -->
  <line x1="320" y1="200" x2="520" y2="200" stroke="url(#brandGradient)" stroke-width="2" opacity="0.5"/>
</svg>